name: Apply Final Settings Fixes V3

on:
  pull_request:
    branches:
      - feature/settings-accessibility-performance
    paths:
      - .github/workflows/apply-final-settings-fixes-v3.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/settings-accessibility-performance
          fetch-depth: 0

      - name: Verify approved starting head
        run: test "$(git rev-parse HEAD)" = "e0bc328aeeed26b1e8c3cdb9074bc59251fe65cc"

      - name: Patch settings recovery and layered overlays
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent
          path = Path('src/features/settings/experienceSettings.js')
          text = path.read_text()

          start = text.index('export function readExperienceSettings(storage) {')
          end = text.index('export function persistExperienceSettings(storage, settings) {', start)
          replacement = dedent('''
            export function readExperienceSettings(storage) {
              if (!storage?.getItem) return { ...DEFAULT_EXPERIENCE_SETTINGS };

              let currentRaw;
              try {
                currentRaw = storage.getItem(EXPERIENCE_SETTINGS_KEY);
              } catch {
                return { ...DEFAULT_EXPERIENCE_SETTINGS };
              }

              if (currentRaw !== null && currentRaw !== undefined) {
                try {
                  return normalizeExperienceSettings(JSON.parse(currentRaw));
                } catch {
                  return { ...DEFAULT_EXPERIENCE_SETTINGS };
                }
              }

              try {
                const legacyRaw = storage.getItem(LEGACY_SHELL_PREFERENCES_KEY);
                if (legacyRaw !== null && legacyRaw !== undefined) {
                  return normalizeExperienceSettings(JSON.parse(legacyRaw));
                }
              } catch {
                // A missing or malformed legacy preference never weakens safe defaults.
              }

              return { ...DEFAULT_EXPERIENCE_SETTINGS };
            }

          ''')
          text = text[:start] + replacement + text[end:]

          needle = '  let currentOverlay = null;\n  let previousFocus = null;\n'
          assert needle in text
          text = text.replace(needle, needle + '  let generatedLabelId = 0;\n', 1)

          needle = '  const findOverlay = () => {\n'
          assert needle in text
          text = text.replace(needle, needle + "    if (documentObject.querySelector('.liber-shell-backdrop .liber-shell-dialog')) return null;\n", 1)

          needle = "      currentOverlay.setAttribute('aria-modal', 'true');\n"
          assert needle in text
          naming = dedent('''
                if (!currentOverlay.hasAttribute('aria-label') && !currentOverlay.hasAttribute('aria-labelledby')) {
                  const heading = currentOverlay.querySelector('h1, h2, h3, [data-liber-overlay-title]');
                  if (heading) {
                    if (!heading.id) {
                      generatedLabelId += 1;
                      heading.id = `liber-overlay-title-${generatedLabelId}`;
                    }
                    currentOverlay.setAttribute('aria-labelledby', heading.id);
                  } else {
                    const closeLabel = found?.button?.getAttribute?.('aria-label')?.replace(/^Close\\s*/i, '').trim();
                    currentOverlay.setAttribute('aria-label', closeLabel || 'Liber 333 dialog');
                  }
                }
          ''')
          text = text.replace(needle, needle + naming, 1)

          needle = '  const onKeyDown = (event) => {\n    if (!currentOverlay) return;\n'
          assert needle in text
          text = text.replace(
              needle,
              "  const onKeyDown = (event) => {\n    if (event.defaultPrevented || documentObject.querySelector('.liber-shell-backdrop .liber-shell-dialog')) return;\n    if (!currentOverlay) return;\n",
              1,
          )
          path.write_text(text)

      - name: Patch asynchronous Sound recovery
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent
          path = Path('src/features/settings/experienceSettings.js')
          text = path.read_text()

          marker = "  const contexts = new Set();\n  const patchSymbol = Symbol.for('liber333.experience.audio.patch');\n  let previousSound = Boolean(getSettings().sound);\n"
          assert marker in text
          helpers = dedent('''
            const contexts = new Set();
            const pendingSuspends = new WeakMap();
            const patchSymbol = Symbol.for('liber333.experience.audio.patch');
            let previousSound = Boolean(getSettings().sound);

            const resumeWhenSettled = (context) => {
              const resumeIfNeeded = () => {
                if (getSettings().sound && context?.state !== 'closed' && context?.state !== 'running') {
                  return context?.resume?.().catch?.(() => {});
                }
                return undefined;
              };
              const pending = pendingSuspends.get(context);
              if (pending) pending.finally(resumeIfNeeded);
              else resumeIfNeeded();
            };

            const suspendContext = (context) => {
              if (!context || context.state === 'closed') return Promise.resolve();
              const existing = pendingSuspends.get(context);
              if (existing) return existing;
              let pending;
              try {
                pending = Promise.resolve(context.suspend?.()).catch(() => {});
              } catch {
                pending = Promise.resolve();
              }
              pendingSuspends.set(context, pending);
              pending.finally(() => {
                if (pendingSuspends.get(context) === pending) pendingSuspends.delete(context);
                if (getSettings().sound) resumeWhenSettled(context);
              });
              return pending;
            };
          ''').lstrip()
          text = text.replace(marker, helpers, 1)

          old = "      if (!getSettings().sound && this?.state !== 'closed') {\n        queueMicrotask(() => this?.suspend?.().catch?.(() => {}));\n      }\n"
          assert old in text
          text = text.replace(old, "      if (!getSettings().sound && this?.state !== 'closed') {\n        queueMicrotask(() => suspendContext(this));\n      }\n", 1)

          start = text.index('    onSettingsChanged(settings) {', text.index('function installSensoryGuards'))
          end = text.index('    destroy() {', start)
          replacement = dedent('''
                onSettingsChanged(settings) {
                  if (!settings.sound) {
                    contexts.forEach((context) => suspendContext(context));
                  } else if (!previousSound) {
                    contexts.forEach((context) => resumeWhenSettled(context));
                  }
                  previousSound = Boolean(settings.sound);
                  if (!settings.voice) synth?.cancel?.();
                },
          ''')
          text = text[:start] + replacement + text[end:]
          path.write_text(text)

      - name: Patch timer-driven reduced animation
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent
          path = Path('src/liber333.jsx')
          text = path.read_text()

          import_line = "import { PLANETS, useLunarPhase, usePlanetaryTime } from './features/cosmic/cosmicTiming.js';"
          assert import_line in text
          text = text.replace(import_line, import_line + "\nimport { getExperienceSettingsRuntime } from './features/settings/experienceSettings.js';", 1)

          start = text.index('const GlitchText = ({ text, active, speed = 30, className = "" }) => {')
          end = text.index('// ─────────────────────────────────────────────\n//  TYPEWRITER TEXT', start)
          glitch = dedent('''
            const useReducedAnimationBudget = () => {
              const runtime = useMemo(() => getExperienceSettingsRuntime(), []);
              const isReduced = (snapshot) => snapshot?.effects === 'low' || snapshot?.effectiveMotion === 'reduced';
              const [reduced, setReduced] = useState(() => isReduced(runtime?.getSnapshot?.()));
              useEffect(() => runtime?.subscribe?.((snapshot) => setReduced(isReduced(snapshot))), [runtime]);
              return reduced;
            };

            const GlitchText = ({ text, active, speed = 30, className = "" }) => {
              const [display, setDisplay] = useState(text);
              const reducedAnimation = useReducedAnimationBudget();
              useEffect(() => {
                if (!active || reducedAnimation) { setDisplay(text); return; }
                let iter = 0;
                const iv = setInterval(() => {
                  setDisplay(text.split("").map((c, i) => {
                    if (c === ' ') return ' ';
                    if (i < iter) return text[i];
                    return GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
                  }).join(""));
                  if (iter >= text.length) clearInterval(iv);
                  iter += 1 / 3;
                }, speed);
                return () => clearInterval(iv);
              }, [text, active, speed, reducedAnimation]);
              return <span className={className}>{display}</span>;
            };

          ''')
          text = text[:start] + glitch + text[end:]

          start = text.index('const TypewriterText = ({ text, speed = 20, onComplete, className = "" }) => {')
          end = text.index('// ─────────────────────────────────────────────\n//  NOISE BACKGROUND', start)
          typewriter = dedent('''
            const TypewriterText = ({ text, speed = 20, onComplete, className = "" }) => {
              const [displayed, setDisplayed] = useState("");
              const [done, setDone] = useState(false);
              const reducedAnimation = useReducedAnimationBudget();
              useEffect(() => {
                if (reducedAnimation) {
                  setDisplayed(text);
                  setDone(true);
                  queueMicrotask(() => onComplete?.());
                  return undefined;
                }
                setDisplayed(""); setDone(false);
                let i = 0;
                const iv = setInterval(() => {
                  i++;
                  setDisplayed(text.slice(0, i));
                  if (i >= text.length) { clearInterval(iv); setDone(true); onComplete?.(); }
                }, speed);
                return () => clearInterval(iv);
              }, [text, speed, reducedAnimation]);
              return (
                <span className={className}>
                  {displayed}
                  {!done && <span className="animate-pulse" style={{ opacity: 0.7 }}>▌</span>}
                </span>
              );
            };

          ''')
          text = text[:start] + typewriter + text[end:]
          path.write_text(text)

      - name: Add focused regression tests
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent
          path = Path('tests/experienceSettings.test.mjs')
          text = path.read_text()

          marker = "test('prefers-reduced-motion is honored until the user makes an explicit choice', () => {"
          assert marker in text
          text = text.replace(marker, dedent('''
            test('malformed current settings recover to defaults instead of reviving stale legacy preferences', () => {
              const storage = memoryStorage({
                [EXPERIENCE_SETTINGS_KEY]: '{bad json',
                [LEGACY_SHELL_PREFERENCES_KEY]: JSON.stringify({ motion: 'reduced', textScale: '130' }),
              });
              const settings = readExperienceSettings(storage);
              assert.equal(settings.motion, 'full');
              assert.equal(settings.motionExplicit, false);
              assert.equal(settings.textSize, 'standard');
            });

          ''') + marker, 1)

          marker = "test('blocked speech schedules an utterance error so speaking state can settle', async () => {"
          assert marker in text
          text = text.replace(marker, dedent('''
            test('Sound Off to On waits for an asynchronous suspension and restores the context', async () => {
              let releaseSuspend;
              class DeferredAudioContext {
                constructor() { this.state = 'running'; }
                createGain() { return {}; }
                suspend() {
                  return new Promise((resolve) => {
                    releaseSuspend = () => { this.state = 'suspended'; resolve(); };
                  });
                }
                resume() { this.state = 'running'; return Promise.resolve(); }
              }
              const runtime = createExperienceSettingsRuntime({
                windowObject: { AudioContext: DeferredAudioContext, dispatchEvent() {} },
                documentObject: null,
                navigatorObject: null,
                storage: memoryStorage(),
              });
              const context = new DeferredAudioContext();
              context.createGain();
              runtime.setSettings({ sound: false });
              runtime.setSettings({ sound: true });
              releaseSuspend();
              await Promise.resolve();
              await Promise.resolve();
              await Promise.resolve();
              assert.equal(context.state, 'running');
              runtime.destroy();
            });

          ''') + marker, 1)

          text += dedent('''

            test('reduced animation and layered dialog contracts are present in source', async () => {
              const reader = await readFile(new URL('../src/liber333.jsx', import.meta.url), 'utf8');
              const runtime = await readFile(new URL('../src/features/settings/experienceSettings.js', import.meta.url), 'utf8');
              assert.match(reader, /useReducedAnimationBudget/);
              assert.match(reader, /if \(!active \|\| reducedAnimation\)/);
              assert.match(reader, /if \(reducedAnimation\) \{/);
              assert.match(runtime, /\.liber-shell-backdrop \.liber-shell-dialog/);
              assert.match(runtime, /aria-labelledby/);
              assert.match(runtime, /resumeWhenSettled/);
            });
          ''')
          path.write_text(text)

      - name: Run complete release gate
        run: npm ci && npm run check

      - name: Commit and push exact repair
        run: |
          set -euo pipefail
          git config user.name "bookthief666"
          git config user.email "208150485+bookthief666@users.noreply.github.com"
          git add src/features/settings/experienceSettings.js src/liber333.jsx tests/experienceSettings.test.mjs
          git diff --cached --check
          git commit -m "Close final settings accessibility edge cases"
          git push origin HEAD:feature/settings-accessibility-performance
