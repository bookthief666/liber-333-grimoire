name: Apply Reduced Ceremony Timing Repair

on:
  push:
    branches:
      - feature/settings-accessibility-performance
    paths:
      - .github/workflows/apply-reduced-ceremony-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/settings-accessibility-performance
          fetch-depth: 0

      - name: Apply verified timeline repair and regression contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app_path = Path('src/liber333.jsx')
          app = app_path.read_text()

          anchor = """    const duration = window.__LIBER333_EXPERIENCE__?.ceremonyDuration?.(7000) ?? 7000;
              const start = Date.now();
          """
          replacement = """    const duration = window.__LIBER333_EXPERIENCE__?.ceremonyDuration?.(7000) ?? 7000;
              const ceremonyScale = duration / 7000;
              const actThresholds = {
                communing: 2500 * ceremonyScale,
                receiving: 4500 * ceremonyScale,
                silence: 6000 * ceremonyScale,
                reveal: 6500 * ceremonyScale,
              };
              const start = Date.now();
          """

          if app.count(anchor) != 1:
              raise SystemExit(f'Expected one ceremony duration anchor, found {app.count(anchor)}')
          app = app.replace(anchor, replacement, 1)

          threshold_replacements = {
              'if (elapsed < 2500) setRitualAct(0);': 'if (elapsed < actThresholds.communing) setRitualAct(0);',
              'else if (elapsed < 4500) {': 'else if (elapsed < actThresholds.receiving) {',
              'else if (elapsed < 6000) setRitualAct(2);': 'else if (elapsed < actThresholds.silence) setRitualAct(2);',
              'else if (elapsed < 6500) setRitualAct(3);': 'else if (elapsed < actThresholds.reveal) setRitualAct(3);',
          }
          for old, new in threshold_replacements.items():
              if app.count(old) != 1:
                  raise SystemExit(f'Expected one threshold `{old}`, found {app.count(old)}')
              app = app.replace(old, new, 1)

          app_path.write_text(app)

          test_path = Path('tests/experienceSettings.test.mjs')
          tests = test_path.read_text()
          contract = """

          test('reduced ceremony scales every ritual act threshold while preserving the full timeline', async () => {
            const source = await readFile(new URL('../src/liber333.jsx', import.meta.url), 'utf8');
            assert.match(source, /const ceremonyScale = duration \/ 7000/);
            assert.match(source, /communing: 2500 \* ceremonyScale/);
            assert.match(source, /receiving: 4500 \* ceremonyScale/);
            assert.match(source, /silence: 6000 \* ceremonyScale/);
            assert.match(source, /reveal: 6500 \* ceremonyScale/);
            assert.doesNotMatch(source, /if \(elapsed < 2500\) setRitualAct/);
            assert.doesNotMatch(source, /else if \(elapsed < 6500\) setRitualAct/);
          });
          """
          marker = "test('reduced ceremony scales every ritual act threshold"
          if marker not in tests:
              test_path.write_text(tests.rstrip() + contract + '\n')

          workflow = Path('.github/workflows/apply-reduced-ceremony-fix.yml')
          workflow.unlink()
          PY

      - name: Validate the repaired feature head
        run: |
          npm ci
          npm run check

      - name: Commit the repair and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/liber333.jsx tests/experienceSettings.test.mjs .github/workflows/apply-reduced-ceremony-fix.yml
          git commit -m "Fix reduced ceremony reveal timing"
          git push origin HEAD:feature/settings-accessibility-performance
