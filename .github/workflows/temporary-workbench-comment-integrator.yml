name: Temporary Workbench comment integrator

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  integrate:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 50 &&
      github.event.comment.user.login == 'bookthief666' &&
      github.event.comment.body == '/run-workbench-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out protected Workbench branch
        uses: actions/checkout@v4
        with:
          ref: feature/grimoire-workbench
          fetch-depth: 0

      - name: Verify exact protected head and synchronize main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "183eb50bbc6159381f4734e249be7fcb3f5b91d9"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply Workbench integration
        run: python scripts/temporary-integrate-workbench.py

      - name: Remove all temporary integration machinery from feature branch
        run: |
          rm -f .github/workflows/apply-grimoire-workbench-ui.yml
          rm -f .github/workflows/temporary-workbench-integrator.yml
          rm -f .github/workflows/temporary-workbench-comment-integrator.yml
          rm -f scripts/temporary-integrate-workbench.py

      - name: Run complete permanent release gate
        run: npm ci && npm run check

      - name: Commit validated integration
        run: |
          set -euo pipefail
          git config user.name "bookthief666"
          git config user.email "208150485+bookthief666@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate responsive Grimoire Workbench"
          git push origin HEAD:feature/grimoire-workbench
