name: Apply Settings Runtime Repairs

on:
  push:
    branches:
      - feature/settings-accessibility-performance
    paths:
      - .github/workflows/apply-settings-runtime-repairs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/settings-accessibility-performance
          fetch-depth: 0

      - name: Verify expected parent head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "d651c84c7ea39192609e6c17c76f745f9d2bc57a"

      - name: Apply guarded runtime repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          def sub_once(pattern, replacement, text, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one regex match, found {count}')
              return updated

          settings_path = Path('src/features/settings/experienceSettings.js')
          settings = settings_path.read_text()

          if 'let previousSound = Boolean(getSettings().sound);' not in settings:
              settings = replace_once(
                  settings,
                  "  const patchSymbol = Symbol.for('liber333.experience.audio.patch');\n",
                  "  const patchSymbol = Symbol.for('liber333.experience.audio.patch');\n  let previousSound = Boolean(getSettings().sound);\n",
                  'audio previous state',
              )

          settings = sub_once(
              r"    onSettingsChanged\(settings\) \{\n      if \(!settings\.sound\) \{.*?\n      \}\n      if \(!settings\.voice\) synth\?\.cancel\?\.\(\);\n    \},",
              """    onSettingsChanged(settings) {
      if (!settings.sound) {
        contexts.forEach((context) => {
          if (context?.state !== 'closed') context?.suspend?.().catch?.(() => {});
        });
      } else if (!previousSound) {
        contexts.forEach((context) => {
          if (context?.state !== 'closed' && context?.state !== 'running') {
            context?.resume?.().catch?.(() => {});
          }
        });
      }
      previousSound = Boolean(settings.sound);
      if (!settings.voice) synth?.cancel?.();
    },""",
              settings,
              'sensory settings transition',
              re.S,
          )

          settings = sub_once(
              r"export function createExperienceSettingsRuntime\(\{\n  windowObject = typeof window !== 'undefined' \? window : null,\n  documentObject = typeof document !== 'undefined' \? document : null,\n  navigatorObject = typeof navigator !== 'undefined' \? navigator : null,\n  storage = windowObject\?\.localStorage,\n\} = \{\}\) \{\n  let settings = readExperienceSettings\(storage\);",
              """export function createExperienceSettingsRuntime({
  windowObject = typeof window !== 'undefined' ? window : null,
  documentObject = typeof document !== 'undefined' ? document : null,
  navigatorObject = typeof navigator !== 'undefined' ? navigator : null,
  storage,
} = {}) {
  let resolvedStorage = storage;
  if (resolvedStorage === undefined) {
    try {
      resolvedStorage = windowObject?.localStorage || null;
    } catch {
      resolvedStorage = null;
    }
  }
  let settings = readExperienceSettings(resolvedStorage);""",
              settings,
              'guarded storage initialization',
          )
          settings = replace_once(
              settings,
              '    if (persist) persistExperienceSettings(storage, settings);',
              '    if (persist) persistExperienceSettings(resolvedStorage, settings);',
              'guarded storage persistence',
          )
          settings_path.write_text(settings)

          hook_path = Path('src/features/settings/useExperienceSettings.js')
          hook_path.write_text("""import { useEffect, useState } from 'react';
import { getExperienceSettingsRuntime } from './experienceSettings.js';

const EXPERIENCE_FALLBACK = Object.freeze({
  effects: 'high',
  effectiveMotion: 'full',
  sound: true,
  voice: true,
});

export function useExperienceSettingsSnapshot() {
  const [settings, setSettings] = useState(() => (
    getExperienceSettingsRuntime()?.getSnapshot?.() || EXPERIENCE_FALLBACK
  ));

  useEffect(() => {
    const runtime = getExperienceSettingsRuntime();
    if (!runtime) return undefined;
    setSettings(runtime.getSnapshot());
    return runtime.subscribe((next) => setSettings(next));
  }, []);

  return settings;
}
""")

          app_path = Path('src/liber333.jsx')
          app = app_path.read_text()
          if "useExperienceSettingsSnapshot" not in app.split('\n', 30)[0:30]:
              app = replace_once(
                  app,
                  "import { PLANETS, useLunarPhase, usePlanetaryTime } from './features/cosmic/cosmicTiming.js';\n",
                  "import { PLANETS, useLunarPhase, usePlanetaryTime } from './features/cosmic/cosmicTiming.js';\nimport { useExperienceSettingsSnapshot } from './features/settings/useExperienceSettings.js';\n",
                  'settings hook import',
              )

          app = replace_once(app, 'const useVoice = () => {', 'const useVoice = (enabled = true) => {', 'voice signature')
          app = replace_once(
              app,
              """  const speak = useCallback((text) => {
    if (!synthRef.current || !text) return;
    synthRef.current.cancel();
""",
              """  useEffect(() => {
    if (enabled) return undefined;
    synthRef.current?.cancel();
    setSpeaking(false);
    return undefined;
  }, [enabled]);

  const speak = useCallback((text) => {
    if (!enabled || !synthRef.current || !text) {
      synthRef.current?.cancel();
      setSpeaking(false);
      return;
    }
    synthRef.current.cancel();
""",
              'voice disabled no-op',
          )
          app = replace_once(
              app,
              '  }, [pickVoice]);\n\n  const stop = useCallback(() => {',
              '  }, [pickVoice, enabled]);\n\n  const stop = useCallback(() => {',
              'voice dependencies',
          )

          app = sub_once(
              r"(const AnimatedSigil = \(\{ input, size = 200, spinning = true, glowing = true,\s*\n\s*evolutionRings = 0, accentColor = \"#dc2626\" \}\) => \{\n)  const \[time, setTime\] = useState\(0\);\n  useEffect\(\(\) => \{\n    if \(!spinning\) return;\n    const iv = setInterval\(\(\) => setTime\(t => t \+ 0\.02\), 16\);\n    return \(\) => clearInterval\(iv\);\n  \}, \[spinning\]\);",
              r"\1  const experienceSettings = useExperienceSettingsSnapshot();\n  const animateSigil = spinning\n    && experienceSettings.effects !== 'low'\n    && experienceSettings.effectiveMotion !== 'reduced';\n  const [time, setTime] = useState(0);\n  useEffect(() => {\n    if (!animateSigil) return undefined;\n    const iv = setInterval(() => setTime(t => t + 0.02), 16);\n    return () => clearInterval(iv);\n  }, [animateSigil]);",
              app,
              'sigil timer throttling',
          )

          app = replace_once(
              app,
              """  } = useGrimoireNavigation();

  // ── Phase: init | input | ritual | revelation ──
""",
              """  } = useGrimoireNavigation();
  const experienceSettings = useExperienceSettingsSnapshot();
  const reduceAtmosphereWork = experienceSettings.effects === 'low'
    || experienceSettings.effectiveMotion === 'reduced';

  // ── Phase: init | input | ritual | revelation ──
""",
              'App settings subscription',
          )
          app = replace_once(app, '  const voice = useVoice();', '  const voice = useVoice(experienceSettings.voice);', 'voice integration')
          app = replace_once(
              app,
              """      {/* Background Layers */}
      <AbyssShader accentColor={accentColor} intensity={abyssIntensity} active={true} />
      <NoiseBackground />
      <ParticleCanvas active={particleActive} intensity={particleIntensity} accentColor={accentColor} />
      {isAmbient && <AmbientWhispers active={true} />}
      <Marginalia />
      <BabalonStar accentColor="#ff2e4d" />
      <Shockwave active={showShockwave} color={accentColor} />
""",
              """      {/* Background Layers */}
      {!reduceAtmosphereWork && (
        <>
          <AbyssShader accentColor={accentColor} intensity={abyssIntensity} active={true} />
          <ParticleCanvas active={particleActive} intensity={particleIntensity} accentColor={accentColor} />
          {isAmbient && <AmbientWhispers active={true} />}
          <Marginalia />
          <BabalonStar accentColor="#ff2e4d" />
        </>
      )}
      <NoiseBackground />
      <Shockwave active={showShockwave} color={accentColor} />
""",
              'runtime atmosphere reduction',
          )
          app_path.write_text(app)

          tests_path = Path('tests/experienceSettings.test.mjs')
          tests = tests_path.read_text()
          tests = replace_once(
              tests,
              '  applyExperienceRootState,\n  getExperienceRootState,',
              '  applyExperienceRootState,\n  createExperienceSettingsRuntime,\n  getExperienceRootState,',
              'runtime test import',
          )
          tests += r'''

test('runtime survives blocked access to the localStorage property', () => {
  const runtime = createExperienceSettingsRuntime({
    windowObject: {
      get localStorage() { throw new Error('SecurityError'); },
      dispatchEvent() {},
    },
    documentObject: null,
    navigatorObject: null,
  });
  assert.equal(runtime.getSnapshot().effects, 'high');
  assert.equal(runtime.getSnapshot().sound, true);
  runtime.destroy();
});

test('Sound Off suspends known contexts and Sound On resumes eligible contexts', async () => {
  let resumes = 0;
  let suspends = 0;
  class FakeAudioContext {
    constructor() { this.state = 'running'; }
    createGain() { return {}; }
    suspend() { suspends += 1; this.state = 'suspended'; return Promise.resolve(); }
    resume() { resumes += 1; this.state = 'running'; return Promise.resolve(); }
  }
  const runtime = createExperienceSettingsRuntime({
    windowObject: { AudioContext: FakeAudioContext, dispatchEvent() {} },
    documentObject: null,
    navigatorObject: null,
    storage: memoryStorage(),
  });
  const context = new FakeAudioContext();
  context.createGain();
  runtime.setSettings({ sound: false });
  await Promise.resolve();
  assert.equal(context.state, 'suspended');
  runtime.setSettings({ sound: true });
  await Promise.resolve();
  assert.equal(context.state, 'running');
  assert.ok(suspends > 0);
  assert.ok(resumes > 0);
  runtime.destroy();
});

test('Low Effects and Reduced Motion stop expensive atmosphere work', async () => {
  const source = await readFile(new URL('../src/liber333.jsx', import.meta.url), 'utf8');
  assert.match(source, /const reduceAtmosphereWork = experienceSettings\.effects === 'low'/);
  assert.match(source, /\{!reduceAtmosphereWork && \(/);
  assert.match(source, /const animateSigil = spinning/);
  assert.match(source, /experienceSettings\.effectiveMotion !== 'reduced'/);
});

test('Voice Off cancels narration and remains a non-speaking no-op', async () => {
  const source = await readFile(new URL('../src/liber333.jsx', import.meta.url), 'utf8');
  assert.match(source, /const useVoice = \(enabled = true\)/);
  assert.match(source, /if \(!enabled \|\| !synthRef\.current \|\| !text\)/);
  assert.match(source, /const voice = useVoice\(experienceSettings\.voice\)/);
});
'''
          tests_path.write_text(tests)

          required = {
              'settings resolved storage': 'resolvedStorage' in settings,
              'sound recovery': 'else if (!previousSound)' in settings,
              'hook file': hook_path.exists(),
              'voice guard': 'const useVoice = (enabled = true)' in app,
              'atmosphere guard': '{!reduceAtmosphereWork && (' in app,
              'sigil throttle': 'const animateSigil = spinning' in app,
          }
          missing = [name for name, present in required.items() if not present]
          if missing:
              raise SystemExit('Missing repair postconditions: ' + ', '.join(missing))

          Path('.github/workflows/apply-settings-runtime-repairs.yml').unlink()
          PY

      - name: Validate repaired feature head
        run: |
          npm ci
          npm run check

      - name: Commit repairs and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair settings runtime behavior"
          git push origin HEAD:feature/settings-accessibility-performance
