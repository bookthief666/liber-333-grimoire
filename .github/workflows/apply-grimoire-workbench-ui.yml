name: Apply Grimoire Workbench UI

on:
  pull_request:
    branches:
      - feature/grimoire-workbench
    paths:
      - .github/workflows/grimoire-workbench-trigger.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out protected Workbench branch
        uses: actions/checkout@v4
        with:
          ref: feature/grimoire-workbench
          fetch-depth: 0

      - name: Verify exact approved branch state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b34d13f91fd7e7f05bea267ef81f625103a72d61"
          test "$(git hash-object src/liber333.jsx)" = "bc0c06ddb38115249fd1d8268bb407f70b529b5a"
          test "$(git hash-object src/features/journal/GrimoireWorkbench.jsx)" = "d0e2ff02919bce0d4e9a1909ad14e387652ff28e"
          test "$(git hash-object src/features/journal/useJournal.js)" = "247ee6ede0c62b6f5c5ded52a3b93ab046078564"
          test "$(git hash-object tests/grimoireWorkbenchUi.test.mjs)" = "ff54d3d2799bad2a397f53d0e262a5ed4d871ea3"

      - name: Integrate Workbench and atomic consultation saves
        shell: python
        run: |
          from pathlib import Path

          reader_path = Path('src/liber333.jsx')
          reader = reader_path.read_text()

          import_line = "import { useJournal } from './features/journal/useJournal.js';"
          workbench_import = "import GrimoireWorkbench from './features/journal/GrimoireWorkbench.jsx';"
          if workbench_import not in reader:
            if import_line not in reader:
              raise SystemExit('Journal import marker not found')
            reader = reader.replace(import_line, import_line + "\n" + workbench_import, 1)

          journal_title = '//  JOURNAL OVERLAY (Enhanced)'
          tree_title = '//  TREE OF LIFE — interactive map of the complete corpus'
          journal_title_index = reader.find(journal_title)
          tree_title_index = reader.find(tree_title)
          if journal_title_index < 0 or tree_title_index < 0 or tree_title_index <= journal_title_index:
            raise SystemExit('Journal overlay component boundaries not found')
          journal_start = reader.rfind('// ─────────────────────────────────────────────', 0, journal_title_index)
          tree_start = reader.rfind('// ─────────────────────────────────────────────', 0, tree_title_index)
          if journal_start < 0 or tree_start < 0:
            raise SystemExit('Journal overlay separators not found')
          reader = reader[:journal_start] + reader[tree_start:]

          save_start_marker = '  // ── Save reading ──'
          reset_marker = '\n\n  // ── Reset ──'
          save_start = reader.find(save_start_marker)
          save_end = reader.find(reset_marker, save_start)
          if save_start < 0 or save_end < 0:
            raise SystemExit('saveReading structural markers not found')

          new_save = '''  // ── Save reading ──
          const saveReading = useCallback(async () => {
            if (!drawnChapter || saved) return;

            const date = new Date().toISOString();
            const consultationId = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
            const spreadPositions = isSpread
              ? ["thesis", "antithesis", "synthesis"]
              : ["single"];
            const entriesToSave = drawnChapters.map((ch, index) => {
              const spreadPosition = spreadPositions[index] || "single";
              return {
                id: `${consultationId}-${spreadPosition}`,
                date,
                consultationId,
                spreadPosition,
                question,
                chapter: ch.chapter,
                title: ch.title,
                gematria: gematriaResult?.simple || 0,
                interpretation: oracle.text || null,
                spreadType: isSpread ? "triad" : "single",
                planetary: planetary?.planet,
                lunar: lunar?.name,
              };
            });

            await journal.addEntries(entriesToSave);
            setSaved(true);
            haptic(30);
          }, [drawnChapter, drawnChapters, question, gematriaResult, oracle.text, saved, journal, isSpread, planetary, lunar]);'''
          reader = reader[:save_start] + new_save + reader[save_end:]

          render_start_marker = '      {/* Journal Overlay */}'
          milestone_marker = '      {/* Milestone Overlay */}'
          render_start = reader.find(render_start_marker)
          render_end = reader.find(milestone_marker, render_start)
          if render_start < 0 or render_end < 0:
            raise SystemExit('Journal render structural markers not found')

          new_render = '''      {/* Journal Overlay */}
          {journalOpen && (
            <GrimoireWorkbench
              entries={journal.entries}
              totalReadings={journal.totalReadings}
              onClose={closeJournal}
              onDelete={journal.removeEntry}
              onClear={journal.clearAll}
              onSelect={viewJournalEntry}
              onExportBackup={journal.exportBackup}
              onExportMarkdown={journal.exportMarkdown}
              onImportBackup={journal.importBackup}
              onSetFavorite={journal.setFavorite}
              onSaveNote={journal.saveNote}
              accentColor={accentColor}
            />
          )}

          '''
          reader = reader[:render_start] + new_render + reader[render_end:]

          required = [
            workbench_import,
            '<GrimoireWorkbench',
            'onExportMarkdown={journal.exportMarkdown}',
            'onSetFavorite={journal.setFavorite}',
            'onSaveNote={journal.saveNote}',
            'journal.addEntries(entriesToSave)',
            'consultationId',
            'spreadPosition',
          ]
          for contract in required:
            if contract not in reader:
              raise SystemExit(f'Missing integrated reader contract: {contract}')
          if 'const JournalOverlay =' in reader:
            raise SystemExit('Legacy JournalOverlay still present')
          if 'journal.addEntry({' in reader:
            raise SystemExit('Sequential journal save still present')

          reader_path.write_text(reader)

      - name: Run complete release gate with captured diagnostics
        id: gate
        shell: bash
        run: |
          set +e
          npm ci 2>&1 | tee /tmp/grimoire-check.log
          install_status=${PIPESTATUS[0]}
          if [[ $install_status -eq 0 ]]; then
            npm run check 2>&1 | tee -a /tmp/grimoire-check.log
            check_status=${PIPESTATUS[0]}
          else
            check_status=$install_status
          fi
          echo "status=$check_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post exact gate failure
        if: steps.gate.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Grimoire Workbench integration gate failed'
            echo
            echo '```text'
            tail -n 180 /tmp/grimoire-check.log
            echo '```'
          } > /tmp/grimoire-comment.md
          gh pr comment 44 --body-file /tmp/grimoire-comment.md
          exit 1

      - name: Commit integrated Workbench and remove temporary machinery
        if: steps.gate.outputs.status == '0'
        run: |
          set -euo pipefail
          git config user.name "bookthief666"
          git config user.email "208150485+bookthief666@users.noreply.github.com"
          git rm .github/workflows/apply-grimoire-workbench-ui.yml
          git add src/liber333.jsx
          git diff --cached --check
          git commit -m "Integrate responsive Grimoire Workbench"
          git push origin HEAD:feature/grimoire-workbench
