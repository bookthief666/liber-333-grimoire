name: Temporary Workbench integrator

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workbench-integration-trigger

permissions:
  contents: write

jobs:
  integrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/workbench-integration-run' &&
      github.event.pull_request.title == 'Run guarded Workbench integration'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out protected Workbench branch
        uses: actions/checkout@v4
        with:
          ref: feature/grimoire-workbench
          fetch-depth: 0

      - name: Verify exact protected head and synchronize main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "183eb50bbc6159381f4734e249be7fcb3f5b91d9"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Integrate responsive Workbench reader boundary
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} target not found')
              return text.replace(old, new, 1)

          workbench_path = Path('src/features/journal/GrimoireWorkbench.jsx')
          workbench = workbench_path.read_text()
          workbench = replace_once(
              workbench,
              """          if (event.key === 'Escape') {
            event.preventDefault();
            onCancel();
          }""",
              """          if (event.key === 'Escape') {
            event.preventDefault();
            event.stopPropagation();
            onCancel();
          }""",
              'note editor Escape',
          )
          workbench = replace_once(
              workbench,
              """  const [status, setStatus] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [clearArmed, setClearArmed] = useState(false);""",
              """  const [status, setStatus] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [clearArmed, setClearArmed] = useState(false);
  const editingIdRef = useRef(null);
  const onCloseRef = useRef(onClose);""",
              'Workbench refs',
          )
          old_effect = """  useEffect(() => {
    const dialog = dialogRef.current;
    if (!dialog) return undefined;
    const previous = document.activeElement;
    searchRef.current?.focus();

    const onKeyDown = (event) => {
      if (event.key === 'Escape') {
        if (editingId) {
          event.preventDefault();
          setEditingId(null);
          return;
        }
        event.preventDefault();
        onClose?.();
        return;
      }
      if (event.key !== 'Tab') return;
      const focusable = [...dialog.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [href], [tabindex]:not([tabindex="-1"])')]
        .filter((element) => element.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable.at(-1);
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    };

    dialog.addEventListener('keydown', onKeyDown);
    return () => {
      dialog.removeEventListener('keydown', onKeyDown);
      if (previous && document.contains(previous)) previous.focus?.();
    };
  }, [editingId, onClose]);"""
          new_effect = """  useEffect(() => {
    editingIdRef.current = editingId;
  }, [editingId]);

  useEffect(() => {
    onCloseRef.current = onClose;
  }, [onClose]);

  useEffect(() => {
    const dialog = dialogRef.current;
    if (!dialog) return undefined;
    const previous = document.activeElement;
    searchRef.current?.focus();

    const onKeyDown = (event) => {
      if (event.key === 'Escape') {
        if (editingIdRef.current) {
          event.preventDefault();
          setEditingId(null);
          return;
        }
        event.preventDefault();
        onCloseRef.current?.();
        return;
      }
      if (event.key !== 'Tab') return;
      const focusable = [...dialog.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [href], [tabindex]:not([tabindex="-1"])')]
        .filter((element) => element.offsetParent !== null);
      if (!focusable.length) return;
      const first = focusable[0];
      const last = focusable.at(-1);
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    };

    dialog.addEventListener('keydown', onKeyDown);
    return () => {
      dialog.removeEventListener('keydown', onKeyDown);
      if (previous && document.contains(previous)) previous.focus?.();
    };
  }, []);"""
          workbench = replace_once(workbench, old_effect, new_effect, 'Workbench focus lifecycle')
          workbench_path.write_text(workbench)

          reader_path = Path('src/liber333.jsx')
          reader = reader_path.read_text()
          import_line = "import { useJournal } from './features/journal/useJournal.js';"
          reader = replace_once(
              reader,
              import_line,
              import_line + "\nimport GrimoireWorkbench from './features/journal/GrimoireWorkbench.jsx';",
              'Workbench import',
          )

          journal_title = '//  JOURNAL OVERLAY (Enhanced)'
          tree_title = '//  TREE OF LIFE — interactive map of the complete corpus'
          journal_title_index = reader.find(journal_title)
          tree_title_index = reader.find(tree_title)
          if journal_title_index < 0 or tree_title_index <= journal_title_index:
              raise SystemExit('Journal overlay component boundaries not found')
          journal_start = reader.rfind('// ─────────────────────────────────────────────', 0, journal_title_index)
          tree_start = reader.rfind('// ─────────────────────────────────────────────', 0, tree_title_index)
          if journal_start < 0 or tree_start < 0:
              raise SystemExit('Journal overlay separators not found')
          reader = reader[:journal_start] + reader[tree_start:]

          old_render = """        <JournalOverlay entries={journal.entries} totalReadings={journal.totalReadings}
          onClose={closeJournal} onDelete={journal.removeEntry}
          onClear={journal.clearAll} onSelect={viewJournalEntry}
          onExportBackup={journal.exportBackup} onImportBackup={journal.importBackup}
          accentColor={accentColor} />"""
          new_render = """        <GrimoireWorkbench
          entries={journal.entries}
          totalReadings={journal.totalReadings}
          onClose={closeJournal}
          onDelete={journal.removeEntry}
          onClear={journal.clearAll}
          onSelect={viewJournalEntry}
          onExportBackup={journal.exportBackup}
          onExportMarkdown={journal.exportMarkdown}
          onImportBackup={journal.importBackup}
          onSetFavorite={journal.setFavorite}
          onSaveNote={journal.saveNote}
          accentColor={accentColor}
        />"""
          reader = replace_once(reader, old_render, new_render, 'Workbench render')

          save_pattern = re.compile(
              r"  // ── Save reading ──\n  const saveReading = useCallback\(async \(\) => \{.*?\n  \}, \[drawnChapter, drawnChapters, question, gematriaResult, oracle\.text, saved, journal, isSpread, planetary, lunar\]\);",
              re.S,
          )
          save_replacement = """  // ── Save reading ──
  const saveReading = useCallback(async () => {
    if (!drawnChapter || saved) return;
    const consultationId = `consultation-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    const date = new Date().toISOString();
    const positions = isSpread ? ['thesis', 'antithesis', 'synthesis'] : ['single'];
    const entriesToSave = drawnChapters.map((ch, index) => ({
      id: `${consultationId}-${positions[index] || index}`,
      consultationId,
      spreadPosition: positions[index] || 'single',
      date,
      question,
      chapter: ch.chapter,
      title: ch.title,
      gematria: gematriaResult?.simple || 0,
      interpretation: oracle.text || null,
      spreadType: isSpread ? 'Thesis/Antithesis/Synthesis' : 'single',
      planetary: planetary?.planet,
      lunar: lunar?.name,
    }));
    await journal.addEntries(entriesToSave);
    setSaved(true);
    haptic(30);
  }, [drawnChapter, drawnChapters, question, gematriaResult, oracle.text, saved, journal, isSpread, planetary, lunar]);"""
          reader, count = save_pattern.subn(save_replacement, reader, count=1)
          if count != 1:
              raise SystemExit('Save-reading block not found')
          reader_path.write_text(reader)

          ui_test = r'''import test from 'node:test';
import assert from 'node:assert/strict';
import { readFile } from 'node:fs/promises';

test('Workbench UI exposes requested local controls and accessible dialog behavior', async () => {
  const source = await readFile(new URL('../src/features/journal/GrimoireWorkbench.jsx', import.meta.url), 'utf8');
  for (const contract of [
    'role="dialog"',
    'aria-modal="true"',
    'aria-labelledby="grimoire-workbench-title"',
    'Search the Workbench',
    'Favorites only',
    'JSON backup',
    'Markdown: all',
    'Markdown: shown',
    'Import JSON',
    'Private integration note',
    'Save note',
    'Recurrence',
    'appearances / consultations',
  ]) assert.ok(source.includes(contract), contract);
  assert.match(source, /event\.key === 'Escape'/);
  assert.match(source, /event\.key !== 'Tab'/);
  assert.match(source, /aria-pressed=\{entry\.favorite === true\}/);
  assert.match(source, /editingIdRef\.current/);
  assert.match(source, /onExportMarkdown/);
  assert.match(source, /onSetFavorite/);
  assert.match(source, /onSaveNote/);
});

test('Workbench CSS includes desktop, mobile, closed-Fold, focus, and reduced-motion contracts', async () => {
  const css = await readFile(new URL('../src/features/journal/grimoireWorkbench.css', import.meta.url), 'utf8');
  assert.match(css, /grid-template-columns: minmax\(250px, 320px\) minmax\(0, 1fr\)/);
  assert.match(css, /@media \(max-width: 760px\)/);
  assert.match(css, /@media \(max-width: 430px\)/);
  assert.match(css, /100dvh/);
  assert.match(css, /:focus-visible/);
  assert.match(css, /prefers-reduced-motion/);
  assert.match(css, /overflow-x: auto/);
});

test('reader uses the extracted Workbench and an atomic journal batch API', async () => {
  const source = await readFile(new URL('../src/liber333.jsx', import.meta.url), 'utf8');
  assert.match(source, /import GrimoireWorkbench/);
  assert.match(source, /<GrimoireWorkbench/);
  assert.match(source, /onExportMarkdown=\{journal\.exportMarkdown\}/);
  assert.match(source, /onSetFavorite=\{journal\.setFavorite\}/);
  assert.match(source, /onSaveNote=\{journal\.saveNote\}/);
  assert.match(source, /journal\.addEntries\(entriesToSave\)/);
  assert.doesNotMatch(source, /const JournalOverlay =/);
});

test('journal hook exposes one atomic batch write and crossed-milestone handling', async () => {
  const source = await readFile(new URL('../src/features/journal/useJournal.js', import.meta.url), 'utf8');
  assert.match(source, /const addEntries = useCallback/);
  assert.match(source, /getMilestoneCrossed/);
  assert.match(source, /entriesRef\.current/);
  assert.match(source, /totalReadingsRef\.current/);
  assert.match(source, /addEntries,/);
});
'''
          Path('tests/grimoireWorkbenchUi.test.mjs').write_text(ui_test)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          script = package['scripts']['test:grimoire-workbench']
          ui_name = 'tests/grimoireWorkbenchUi.test.mjs'
          if ui_name not in script:
              script = script + ' ' + ui_name
          package['scripts']['test:grimoire-workbench'] = script
          package_path.write_text(json.dumps(package, indent=2) + '\n')

          Path('.github/workflows/apply-grimoire-workbench-ui.yml').unlink(missing_ok=True)

      - name: Run complete permanent release gate
        run: npm ci && npm run check

      - name: Commit validated integration
        run: |
          set -euo pipefail
          git config user.name "bookthief666"
          git config user.email "208150485+bookthief666@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integrate responsive Grimoire Workbench"
          git push origin HEAD:feature/grimoire-workbench
