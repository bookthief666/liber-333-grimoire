name: Repair synchronous Workbench note focus

on:
  pull_request:
    branches:
      - feature/grimoire-workbench
    paths:
      - .github/workflows/workbench-synchronous-focus-trigger.txt

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out protected Workbench branch
        uses: actions/checkout@v4
        with:
          ref: feature/grimoire-workbench
          fetch-depth: 0

      - name: Verify exact source state
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "fc4d97cdbac5899bc7771435d2fe28f112412665"
          test "$(git hash-object src/features/journal/GrimoireWorkbench.jsx)" = "2a056ab116aed9e6482e5a7c7691adc342779968"

      - name: Restore note trigger focus synchronously
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/features/journal/GrimoireWorkbench.jsx')
          source = path.read_text()
          old = '''  const closeNoteEditor = useCallback(() => {
    setEditingId(null);
    requestAnimationFrame(() => {
      const trigger = editingTriggerRef.current;
      if (trigger && document.contains(trigger)) trigger.focus();
    });
  }, []);'''
          new = '''  const closeNoteEditor = useCallback(() => {
    const trigger = editingTriggerRef.current;
    if (trigger && document.contains(trigger)) trigger.focus();
    setEditingId(null);
  }, []);'''

          if source.count(old) != 1:
            raise SystemExit(f'Expected one asynchronous focus block, found {source.count(old)}')
          source = source.replace(old, new, 1)

          required = [
            'const closeNoteEditor = useCallback',
            'if (trigger && document.contains(trigger)) trigger.focus();\n    setEditingId(null);',
            'onCancel={closeNoteEditor}',
          ]
          for contract in required:
            if contract not in source:
              raise SystemExit(f'Missing synchronous focus contract: {contract}')
          if 'requestAnimationFrame(() => {\n      const trigger = editingTriggerRef.current;' in source:
            raise SystemExit('Asynchronous note focus restoration still present')

          path.write_text(source)

      - name: Run complete release gate
        run: |
          set -euo pipefail
          npm ci
          npm run check

      - name: Commit source repair and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "bookthief666"
          git config user.email "208150485+bookthief666@users.noreply.github.com"
          git rm .github/workflows/repair-workbench-synchronous-note-focus.yml
          git add src/features/journal/GrimoireWorkbench.jsx
          git diff --cached --check
          git commit -m "Restore note trigger focus synchronously"
          git push origin HEAD:feature/grimoire-workbench
